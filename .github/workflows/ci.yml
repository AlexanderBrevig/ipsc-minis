name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix run .#render
      - uses: actions/upload-artifact@v4
        with:
          name: stl
          path: |
            stl/*.stl
            preview.png
